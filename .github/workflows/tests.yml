name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "cryptography>=42" "solders>=0.21" "mnemonic>=0.21" "base58>=2.1" "numpy>=1.26" "scikit-learn>=1.4" "scipy>=1.11" "pytest>=8"
      - name: JavaScript syntax
        run: for f in web/*.js; do node --check "$f"; done
      - name: Tests (no network)
        env:
          CAGE_OFFLINE: "1"
        run: python -m pytest -q
